<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intelligence alone is not nearly enough when it comes to acting wisely.</title>
    <meta name="description" content="It is amazing what one ray of sunshine can do for a man!">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">

    <style>
        body {
            background-color: #f0f0f0;
            color: black;
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: white;
                background-color: #181818;
            }
        }

        .quote {
            font-family: 'Courier New', monospace;
            font-size: 1.5em;
            line-height: 1.5;
            margin: 0 auto;
            max-width: 50ch;
            padding: 2em;
            text-align: center;
        }

        .quote .signature {
            display: block;
            font-size: 0.8em;
            margin-top: 1.5em;
        }
    </style>
</head>

<body>
	 <p class="quote">
	   It was a wonderful night, such a night as
	   is only possible when we are young, dear reader.
	   		
		 <span class="signature">
			 ― Fyodor Dostoyevsky, White Nights
		 </span>
	 </p>
</body>

</html>
